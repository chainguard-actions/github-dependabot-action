name: Test re-run prevention via GITHUB_TRIGGERING_ACTOR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action checks GITHUB_TRIGGERING_ACTOR to prevent manual re-runs
      # of Dependabot workflows. Setting it to a non-dependabot value should
      # cause the action to warn and exit gracefully.
      # Note: the actor check fires first (actor != dependabot[bot]), so the
      # action returns null before reaching the GITHUB_TRIGGERING_ACTOR check.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TRIGGERING_ACTOR: 'some-human-user'
          DEPENDABOT_DISABLE_CLEANUP: '1'

      - name: Assert action exited gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should warn and exit without hard-failing when
          # triggered by a non-dependabot actor or triggering actor.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' as expected"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
