name: Test unsupported event exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action only supports the 'dynamic' event (Dependabot-triggered).
      # Under act the event is always 'workflow_dispatch', which is unsupported.
      # The action should warn "does not support 'workflow_dispatch' events"
      # and return null (log "finished: nothing to do") without calling setFailed.
      # The step should therefore succeed (exit 0).
      - id: action
        uses: .

      - name: Assert action exited gracefully for unsupported event
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed (exit gracefully) for unsupported event type"
            exit 1
          fi
          echo "PASS: action exited gracefully for unsupported event"
