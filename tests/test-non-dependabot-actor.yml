name: Test non-Dependabot actor exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action exited gracefully (non-Dependabot actor)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When triggered by a non-Dependabot actor, the action should succeed
          # (exit 0) after emitting a warning that only Dependabot can trigger it.
          # It should NOT set a failure status.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully as expected for non-Dependabot actor"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail when triggered by a non-Dependabot actor"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
