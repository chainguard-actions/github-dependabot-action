name: Test workflow_dispatch event handled gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action only supports the 'dynamic' event type (Dependabot-triggered).
      # Under act the event is always 'workflow_dispatch', and the actor is never
      # 'dependabot[bot]'. The action should warn and exit without calling setFailed.
      # We verify the action does not crash with an unhandled exception.
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (warning path: nothing to do)
          # or fail gracefully. It must not produce an unhandled exception
          # that would indicate a code defect.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited successfully (warning emitted, nothing to do)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully under harness conditions"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
