name: Test re-run by non-Dependabot triggering actor exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Simulate a re-run scenario where GITHUB_TRIGGERING_ACTOR is a
          # non-Dependabot user. The action reads this directly from process.env,
          # so setting it here takes effect. The action should warn and exit
          # gracefully (not fail) in this case.
          GITHUB_TRIGGERING_ACTOR: some-human-user

      - name: Assert action exited gracefully (non-Dependabot triggering actor)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed (exit 0) after emitting a warning that
          # Dependabot workflows cannot be re-run by a non-Dependabot actor.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully as expected for non-Dependabot triggering actor"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail when GITHUB_TRIGGERING_ACTOR is a non-Dependabot user"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
