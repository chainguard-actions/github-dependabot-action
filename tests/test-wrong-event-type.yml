name: Test unsupported event type exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action only supports the 'dynamic' event type (used by Dependabot).
      # Under act the event is 'workflow_dispatch', so the action should warn
      # about the unsupported event and exit gracefully (not fail hard).
      # Additionally, the actor check fires first (actor != dependabot[bot]),
      # so the action returns null before even checking the event type.
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (graceful no-op) or fail with a
          # clear error — it must not produce an unexpected outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' as expected"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
